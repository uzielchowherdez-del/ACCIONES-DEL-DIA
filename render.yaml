services:
  - type: worker
    name: bmv-bot-telegram
    env: python
    region: oregon
    plan: starter # $7/mes = PRO, nunca se duerme. Cambia a free si quieres probar gratis pero se dormirá
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py interactive
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false