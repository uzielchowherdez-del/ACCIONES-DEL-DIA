name: TOP BMV v11 FIX IPC OPEN
on:
  schedule:
    - cron: '35 14 * * 1-5'  # 8:35 AM Mexico
  workflow_dispatch:
concurrency:
  group: bmv-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run v11
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_telegram_daily_v11.py
