name: TOP BMV v11 FIX IPC OPEN
on:
  schedule:
    - cron: '35 14 * * 1-5'  # 8:35 AM Mexico
  workflow_dispatch:
concurrency:
  group: bmv-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps directo sin requirements.txt
        run: |
          pip install --upgrade pip
          pip install yfinance==0.2.54 pandas==2.2.2 numpy==1.26.4 requests==2.31.0 pytz==2024.1 lxml==5.2.2
      - name: Run v11
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          ls -la
          BOT=$(ls -1 bot*.py 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BOT" ]; then
            echo "No encontre bot*.py, buscando cualquier .py"
            BOT=$(ls -1 *.py 2>/dev/null | head -n 1)
          fi
          echo ">>> Ejecutando $BOT"
          python "$BOT"
